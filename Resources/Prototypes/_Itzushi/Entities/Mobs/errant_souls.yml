#MARK: Base
- type: entity
  parent: [ MobElementalBase, MobCombat ]
  id: BaseMobMonsterErrantSoul
  name: errant soul
  abstract: true
  description: A soul that strayed too far from the path or was stuck too long in limbo, now roaming in search of your life essence, at all costs.
  components:
  # - type: NpcFactionMember
    # factions:
    # - NpcFactionLostSouls

  # - type: HTN
    # rootTask:
      # task: SimpleHostileCompound

  - type: Sprite
    drawdepth: Mobs
    state: alive

  - type: MovementSpeedModifier
    baseWalkSpeed: 1
    baseSprintSpeed: 2

  - type: MeleeWeapon
    attackRate: 0.5
    soundHit:
      path: /Audio/Weapons/Xeno/alien_claw_flesh3.ogg
    angle: 0
    animation: WeaponArcClaw
    damage:
      types:
        Structural: 150
        Slash: 20
        Blunt: 20
        Heat: 20
        Piercing: 20
        Radiation: 10

  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
      - !type:SpawnEntitiesBehavior
        spawn:
          MaterialObjectLifeEssenceStack1:
            min: 1
            max: 3
      - !type:DoActsBehavior
        acts: [ "Destruction" ]


#MARK: Stalker
- type: entity
  parent: BaseMobMonsterErrantSoul
  id: MobMonsterErrantSoulStalker
  name: stalker errant soul
  components:
  - type: Sprite
    sprite: _Itzushi/Mobs/ErrantSouls/errant_soul_stalker.rsi

  - type: MovementSpeedModifier
    baseWalkSpeed: 5.5
    baseSprintSpeed: 5.5

  - type: MeleeWeapon
    attackRate: 2
    damage:
      types:
        Slash: 8


#MARK: Crackle
- type: entity
  parent: BaseMobMonsterErrantSoul
  id: MobMonsterErrantSoulCrackle
  name: crackle errant soul
  components:
  - type: Sprite
    sprite: _Itzushi/Mobs/ErrantSouls/errant_soul_crackle.rsi

  - type: MovementSpeedModifier
    baseWalkSpeed: 2.5
    baseSprintSpeed: 2.5

  - type: MeleeWeapon
    soundHit:
      collection: MetalThud
    attackRate: 0.5
    damage:
      types:
        Slash: 20
        Piercing: 10
   # - type: IgniteOnMeleeHit
    # fireStacks: 1

#MARK: Lurker //placeholder
- type: entity
  parent: BaseMobMonsterErrantSoul
